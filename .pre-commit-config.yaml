repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        name: ruff lint
        stages: [pre-commit]
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: sanity-check
        name: sanity check
        stages: [pre-push]
        language: system
        entry: ./scripts/run-sanity-check --raw
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty (type check)
        stages: [pre-commit]
        language: system
        entry: uv run ty check --python .venv --exclude notebooks/ .
        pass_filenames: false
        always_run: true
