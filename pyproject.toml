[project]
name = "Transformer"
version = "0.1.0"
description = "Implementation of Transformer in Scratch"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tqdm",
    'torch',
    'datasets',
    'pydantic>=2.0',
    'click',
    'codetiming',
    "sentencepiece",
    "psutil",
    "humanize",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "ipython>=9.4.0",
    "jupyter",
    "ty>=0.0.41",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-sugar>=0.9.7",
    "pytest-clarity>=1.0.1",
    "pytest-mock>=3.10.0",
    "pytest-benchmark>=4.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "B", "UP", "C4", "SIM", "RUF", "PERF"]
ignore = [
    "E501",    # line-too-long (black enforces line length)
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0911", # too-many-return-statements
    "PLW1514", # unspecified-encoding
    "PLR2004", # magic-value-comparison (common in ML: dim == 0, size == 1, etc.)
    "SIM108",  # ternary-operator (hurts readability in complex tensor expressions)
]

[tool.ruff.lint.pylint]
max-branches = 12
max-locals = 15
max-statements = 50
max-bool-expr = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

[tool.setuptools]
packages = ["transformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
    "--durations=10",
    "--html=reports/report.html",
    "--self-contained-html",
    "--cov=.",
    "--cov-report=html:reports/coverage",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
